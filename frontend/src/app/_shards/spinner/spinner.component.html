<div class="loader-container" [class.centered]="centered()" [class.d-none]="!visible()">
    @if (logo()) {
        <img src="assets/nexus-loading/nexus_loading.webp" class="talvis-loader" [style.width.px]="size()" [style.height.px]="size()" alt="" />
    } @else if (inline()) {
        <span class="loader-dots"><span></span><span></span><span></span></span>
    } @else {
        <span class="loader-bar"></span>
    }
</div>

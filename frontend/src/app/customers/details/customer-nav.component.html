@let _company = company();
<router-outlet></router-outlet>

<app-header>
    <div class="logo" [style.background-image]="'url(' + _company.getAvatar() + ')'" [nx]="_company" smartLink="/customers/{{ _company.id }}" [dnd]="_company.apiPathWithId() + '/avatar'" [dndAllowed]="['image/']" (dndUploaded)="onDndUploaded()"></div>
    <h1>{{ _company.getName() }}</h1>
    <ul class="nav">
        <header-route-nav [context]="_company"></header-route-nav>
        @if (_company.base_projects.length) {
            <li class="nav-item" ngbDropdown [autoClose]="true" placement="bottom-start" #dropdown="ngbDropdown">
                <a class="nav-link text-secondary d-flex align-items-center" ngbDropdownToggle (mouseenter)="dropdown.open()">
                    <i>apps</i>
                </a>
                <ul class="dropdown-menu" ngbDropdownMenu (mouseleave)="dropdown.close()">
                    @for (p of _company.base_projects; track p.id) {
                        <li>
                            <a class="dropdown-item hstack gap-2" [routerLink]="['/projects', p.id]">
                                <project [project]="p" [noRouting]="true"></project>
                                <span>{{ p.name }}</span>
                            </a>
                        </li>
                    }
                </ul>
            </li>
        }
    </ul>
</app-header>

<activity-tab icon="chat" i18n-label="@@i18n.common.comments" label="comments" class="list-group list-group-accent ng-star-inserted">
    <app-tab-comments path="companies/{{ _company.id }}" [projects]="_company.base_projects"></app-tab-comments>
</activity-tab>

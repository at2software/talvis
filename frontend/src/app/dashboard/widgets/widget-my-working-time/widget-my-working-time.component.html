@let _chartOptions = chartOptions();
<div class="card card-chart mb-3">
    <div class="card-header gap-2">
        <n>hr</n>
        <span class="flex-fill text-truncate" i18n="@@i18n.widget-my-working-time">my working time</span>
        @if (_chartOptions) {
            <div class="chart-title" [class.text-danger]="average() < averageSoll() * 0.9" [ngbTooltip]="'average working hours per week (required: ' + averageSoll() + ' h)'"><value-unit [value]="average() | number: '1.1-1'" unit="h" /></div>
        }
    </div>

    <div class="card-body">
        <div class="mb-2">
            @if (!_chartOptions) {
                <div style="height: 100px"></div>
            }
            @if (_chartOptions) {
                <div echarts [options]="_chartOptions" [initOpts]="{ height: 100 }" (chartInit)="onChartInit($event)" style="height: 100px"></div>
            }
        </div>
        <progress-bar [height]="3" [progress]="workThisWeek() / requiredWorkThisWeek()" [style]="'primary'" [overStyle]="'warning'" [ngbTooltip]="'this week: ' + workThisWeek() + '/' + requiredWorkThisWeek() + ' h'"></progress-bar>
    </div>

    <widget-options [options]="getOptions()" (updated)="_onUpdate($event)" (deleted)="onDelete($event)"></widget-options>
</div>

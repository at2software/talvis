@let _data = data();
<div class="card card-chart mb-3" [class.d-none-container]="_data.length === 0">
    <div class="card-header gap-2">
        <n>project</n>
        <span class="flex-fill text-truncate" i18n="@@i18n.project.missingProjectManager">missing project manager</span>
        <span class="badge badge-dark">{{ value() ?? (value() | loading) }}</span>
    </div>

    <widget-options [options]="getOptions()" (updated)="_onUpdate($event)" (deleted)="onDelete($event)"></widget-options>

    @if (_data.length > 0) {
        <ul class="list-group list-group-flush">
            @for (_ of _data; track _.id; let i = $index) {
                <li class="list-group-item d-flex text-nowrap" [nx]="_" context="widget-missing-project-manager" [tables]="_data" [compact]="indexExceedsSettings(i)">
                    <div>
                        <avatar [object]="_"></avatar>
                    </div>
                    <div class="flex-fill ms-3 text-truncate">
                        <div class="d-flex text-truncate">
                            <div class="flex-fill text-truncate">{{ _.name }}</div>
                            <div class="text-muted" roles="invoicing">{{ _.net_remaining | mshort }}</div>
                        </div>
                        <progress-bar [class.d-none]="!_.state.isRunning()" [style]="_.css()" [progress]="_.progress()"></progress-bar>
                    </div>
                </li>
            }
        </ul>
    }
</div>

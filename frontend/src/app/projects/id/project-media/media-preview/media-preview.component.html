@let _parent = trackedParent();
@if (_parent) {
    <div class="card mb-3" [dnd]="_parent.apiPathWithId() + '/media'" (dndUploaded)="onUploaded()">
        <div class="card-header" i18n="@@i18n.common.media">media</div>
        @if (files().length) {
            <ul class="list-group">
                @for (file of files(); track file.id) {
                    <li class="list-group-item hstack gap-2" [nx]="file" [tables]="files()">
                        <div>
                            <file [color]="file.css()" [size]="32" (click)="show(file)"
                                ><i>{{ file.getIcon() }}</i></file
                            >
                        </div>
                        <div class="vstack gap-0">
                            <span class="font-monospace">{{ file.name }}</span>
                            <span class="font-monospace text-muted text-smaller" style="font-size: 10px">{{ file.created_at | date: 'short' }}</span>
                        </div>
                    </li>
                }
            </ul>
        } @else {
            <div class="card-body py-2 small text-muted hstack gap-2">
                <i>upload_file</i>
                <span i18n="@@i18n.common.dropFilesHere">drop files here to attach them</span>
            </div>
        }
    </div>
}
